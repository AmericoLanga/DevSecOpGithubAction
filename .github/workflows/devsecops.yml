name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: configurar JDK 17 java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: compilar codigo do java
        run: javac src/Main.java

      - name: build a imagem docker
        run: docker build -t projetoi-java:v2 .

      - name: Escaneamento com trivy (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'projetoi-java:v2'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  deploy:
  needs: build-and-scan
  runs-on: ubuntu-latest
  steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4

    - name: Login no Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build e Push da Imagem Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/meu-servidor-java:v2
